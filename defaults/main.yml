# You'll need to override the registration token and URL for your GitLab
# instance. To get a token, see the instructions:
# https://docs.gitlab.com/ci/runners/runners_scope/
gitlab_runner_reg_token: ""
gitlab_runner_ci_server_url: https://gitlab.{{ ansible_domain }}/

gitlab_runner_key_url: https://packages.gitlab.com/gpg.key
gitlab_runner_checksum: sha256:003c0ca2fea61767f8c6de7a1c0f49fc88ea3c8db95e3cd1856b32ce9d876e0f
gitlab_runner_user: gitlab-runner


gitlab_runner_name: "{{ ansible_domain }}-{{ ansible_distribution | lower }}-{{ ansible_distribution_major_version }}"
gitlab_runner_tags: "{{ ansible_distribution | lower }},{{ ansible_distribution | lower }}-{{ ansible_distribution_major_version }}"

# If you want your CI runner to run everything in a shell, your env vars should
# look something like this:
gitlab_runner_env_vars:
  RUNNER_TAG_LIST: "{{ gitlab_runner_tags }},shell"
  RUNNER_EXECUTOR: shell
  RUNNER_NAME: "{{ gitlab_runner_name }}-shell"
  REGISTRATION_TOKEN: "{{ gitlab_runner_reg_token }}"
  CI_SERVER_URL: "{{ gitlab_runner_ci_server_url }}"
  REGISTER_NON_INTERACTIVE: true
  CI_SERVER_TLS_CA_FILE:

# If you want your CI runner to run everything in docker, your env vars might
# look like this:
# gitlab_runner_env_vars:
#   HTTP_PROXY: proxy.{{ ansible_domain }}:3128
#   HTTPS_PROXY: proxy.{{ ansible_domain }}:3128
#   https_proxy: http://proxy.{{ ansible_domain }}:3128
#   http_proxy: http://proxy.{{ ansible_domain }}:3128
#   RUNNER_TAG_LIST: "{{ gitlab_runner_tags }},docker"
#   RUNNER_EXECUTOR: docker
#   RUNNER_NAME: "{{ gitlab_runner_name }}-docker"
#   REGISTRATION_TOKEN: "{{ gitlab_runner_reg_token }}"
#   CI_SERVER_URL: "{{ gitlab_runner_ci_server_url }}"
#   REGISTER_NON_INTERACTIVE: true
#   CI_SERVER_TLS_CA_FILE:

# If you want this runner to run untagged jobs, leave this variable alone.
# If you don't, change it to an empty string.
gitlab_runner_run_untagged: "--run-untagged"

# Enable passing additional arguments to the registration command. Default is
# to not specify anything special, example below is for specifying extra args
# for docker.
gitlab_runner_extra_args: ""
